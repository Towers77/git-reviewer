[package]
name = "git-reviewer"
version = "0.3.0"
edition = "2024"
description = "A lightweight desktop app to review and commit changes across many git repos and worktrees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Towers77/git-reviewer"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "advanced"] }
iced_palace = "0.14.0"
notify-debouncer-mini = "0.8.0"
dirs = "7.0.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
# Syntax highlighting: syntect with two-face's syntaxes (about 200 languages) and the
# pure-Rust fancy-regex engine. The C one (onig) is about twice as fast, but its C code
# can't be built when CI lints the macOS target from Windows. syntect is listed too
# only for `plist-load`, to read the bundled `.tmTheme`.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5.3.0", default-features = false, features = ["plist-load"] }
# Draws the window icon from assets/app-icon/icon.svg. iced already uses this version
# (with its default features) to draw SVGs, so nothing new is compiled.
resvg = "0.50.0"

[build-dependencies]
# Builds the app icon into the Windows .exe (see build.rs).
embed-resource = "3.0.12"

# Highlighting is several times slower unoptimized, so its crates are optimized in
# debug builds too, which makes them about as fast as in release.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3